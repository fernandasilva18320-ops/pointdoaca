<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Point do Açaí — Especiais</title>

<style>

:root{
  --roxo:#250b2f;
  --roxo2:#5b0872;
  --roxo3:#7b0b93;
  --amarelo:#ffc400;
  --branco:#fff;
  --cinza:#f7f7f7;
  --texto:#2a2230;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--cinza);
  color:var(--texto);
}

/* =========================
   CABEÇALHO
========================= */

header{
  position:sticky;
  top:0;
  z-index:1000;

  height:74px;

  background:var(--roxo);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 5%;

  box-shadow:0 4px 18px #0003;
}

.logo{
  font-size:24px;
  font-weight:900;
  color:white;
}

.logo span{
  color:var(--amarelo);
}

nav{
  display:flex;
  gap:28px;
  align-items:center;
}

nav a{
  color:white;
  text-decoration:none;
  font-weight:700;
  font-size:14px;
}

nav a:hover{
  color:var(--amarelo);
}

/* BOTÃO CARRINHO */

.cart-btn{
  border:0;
  background:var(--amarelo);
  color:#171018;

  font-weight:900;

  border-radius:30px;

  padding:14px 22px;

  cursor:pointer;
}

.cart-btn:hover{
  transform:scale(1.02);
}

.cart-count{
  display:inline-flex;

  min-width:22px;
  height:22px;

  align-items:center;
  justify-content:center;

  background:var(--roxo);

  color:white;

  border-radius:50%;

  font-size:12px;

  margin-left:5px;
}

/* =========================
   HERO
========================= */

.hero{
  text-align:center;

  padding:65px 20px 35px;

  background:
  linear-gradient(
    135deg,
    #fff,
    #f0e8f3
  );
}

.hero h1{
  font-size:clamp(34px,6vw,58px);

  font-weight:1000;

  color:var(--roxo);
}

.hero h1 span{
  color:var(--amarelo);
}

.hero p{
  margin-top:12px;

  color:#655c68;

  font-size:17px;
}

/* =========================
   SEÇÃO
========================= */

.section{
  max-width:1200px;

  margin:0 auto;

  padding:40px 22px 80px;
}

.section-title{
  text-align:center;

  margin-bottom:30px;
}

.section-title h2{
  font-size:38px;

  color:var(--roxo);

  font-weight:1000;
}

.section-title p{
  margin-top:8px;

  color:#716975;
}

/* =========================
   PRODUTOS
========================= */

.specials{
  display:grid;

  grid-template-columns:
  repeat(3,1fr);

  gap:22px;
}

.card{
  background:var(--roxo);

  border-radius:26px;

  overflow:hidden;

  box-shadow:
  0 12px 28px #0002;

  color:white;

  display:flex;

  flex-direction:column;
}

.card img{
  width:100%;

  height:310px;

  object-fit:cover;

  display:block;

  background:#4a075b;
}

.card-body{
  padding:22px;

  display:flex;

  flex-direction:column;

  flex:1;
}

.tag{
  color:var(--amarelo);

  font-size:12px;

  font-weight:900;

  text-transform:uppercase;

  margin-bottom:8px;
}

.card h3{
  font-size:30px;

  line-height:.95;

  margin-bottom:12px;

  font-weight:1000;
}

.card p{
  color:#e8dfea;

  line-height:1.5;

  font-size:14px;

  min-height:64px;
}

.price-row{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  margin-top:auto;

  padding-top:18px;
}

.price{
  font-size:25px;

  font-weight:1000;

  color:var(--amarelo);
}

.add-btn{
  border:0;

  border-radius:14px;

  background:var(--amarelo);

  color:#1e1321;

  padding:13px 16px;

  font-weight:900;

  cursor:pointer;
}

.add-btn:hover{
  transform:translateY(-2px);

  filter:brightness(1.05);
}

/* =========================
   CARRINHO
========================= */

.overlay{
  position:fixed;

  inset:0;

  background:#0007;

  z-index:2000;

  opacity:0;

  pointer-events:none;

  transition:.25s;
}

.overlay.open{
  opacity:1;

  pointer-events:auto;
}

.cart{
  position:fixed;

  right:0;

  top:0;

  height:100vh;

  width:min(430px,100%);

  background:white;

  z-index:2001;

  transform:translateX(100%);

  transition:.3s;

  display:flex;

  flex-direction:column;

  box-shadow:-8px 0 30px #0003;
}

.cart.open{
  transform:translateX(0);
}

.cart-head{
  background:var(--roxo);

  color:white;

  padding:22px;

  display:flex;

  justify-content:space-between;

  align-items:center;
}

.cart-head h2{
  font-size:24px;
}

.close{
  border:0;

  background:transparent;

  color:white;

  font-size:30px;

  cursor:pointer;
}

.cart-items{
  padding:18px;

  overflow:auto;

  flex:1;
}

.empty{
  text-align:center;

  color:#777;

  padding:50px 20px;
}

/* ITEM DO CARRINHO */

.item{
  display:grid;

  grid-template-columns:
  64px 1fr auto;

  gap:12px;

  align-items:center;

  padding:12px 0;

  border-bottom:1px solid #eee;
}

.item img{
  width:64px;

  height:64px;

  object-fit:cover;

  border-radius:12px;
}

.item h4{
  font-size:15px;

  color:var(--roxo);

  margin-bottom:5px;
}

.item-price{
  font-weight:800;

  font-size:14px;
}

.qty{
  display:flex;

  align-items:center;

  gap:8px;

  margin-top:7px;
}

.qty button{
  width:26px;

  height:26px;

  border:0;

  border-radius:7px;

  background:#eee;

  cursor:pointer;

  font-weight:900;
}

.remove{
  border:0;

  background:transparent;

  color:#b00020;

  cursor:pointer;

  font-size:12px;

  margin-top:5px;
}

.item-total{
  font-weight:900;

  color:var(--roxo);
}

/* RODAPÉ CARRINHO */

.cart-foot{
  padding:18px;

  border-top:1px solid #eee;
}

.total{
  display:flex;

  justify-content:space-between;

  font-size:21px;

  font-weight:1000;

  margin-bottom:14px;
}

.checkout{
  width:100%;

  border:0;

  background:#25d366;

  color:white;

  border-radius:14px;

  padding:16px;

  font-size:16px;

  font-weight:1000;

  cursor:pointer;
}

.checkout:hover{
  filter:brightness(1.05);
}

.clear{
  width:100%;

  margin-top:9px;

  border:1px solid #ddd;

  background:white;

  border-radius:12px;

  padding:11px;

  cursor:pointer;

  color:#555;

  font-weight:700;
}

.notice{
  text-align:center;

  font-size:12px;

  color:#777;

  margin-top:12px;
}

/* =========================
   CELULAR
========================= */

@media(max-width:900px){

  nav{
    display:none;
  }

  .specials{
    grid-template-columns:1fr;
  }

  .card img{
    height:340px;
  }

}

@media(max-width:520px){

  header{
    padding:0 16px;
  }

  .logo{
    font-size:20px;
  }

  .hero{
    padding-top:42px;
  }

  .section{
    padding-left:14px;
    padding-right:14px;
  }

  .cart-btn{
    padding:11px 14px;
    font-size:12px;
  }

}

</style>
</head>

<body>


<!-- =========================
     CABEÇALHO
========================= -->

<header>

  <div class="logo">
    POINT DO <span>AÇAÍ</span>
  </div>

  <nav>

    <a href="#inicio">
      Início
    </a>

    <a href="#especiais">
      Especiais
    </a>

    <a href="#especiais">
      Acompanhamentos
    </a>

  </nav>

  <button
    class="cart-btn"
    onclick="abrirCarrinho()"
  >

    🛒 Montar meu pedido

    <span
      class="cart-count"
      id="cartCount"
    >
      0
    </span>

  </button>

</header>


<!-- =========================
     INÍCIO
========================= -->

<section
  class="hero"
  id="inicio"
>

  <h1>
    ESPECIAIS DO
    <span>POINT</span>
  </h1>

  <p>
    Escolha seu favorito e adicione direto ao carrinho.
  </p>

</section>


<!-- =========================
     ESPECIAIS
========================= -->

<section
  class="section"
  id="especiais"
>

  <div class="section-title">

    <h2>
      Especiais
    </h2>

    <p>
      Opções especiais do Point do Açaí
    </p>

  </div>


  <div
    class="specials"
    id="produtos"
  >

    <!-- Os produtos serão criados pelo JavaScript -->

  </div>

</section>


<!-- =========================
     FUNDO DO CARRINHO
========================= -->

<div
  class="overlay"
  id="overlay"
  onclick="fecharCarrinho()"
></div>


<!-- =========================
     CARRINHO
========================= -->

<aside
  class="cart"
  id="cart"
>

  <div class="cart-head">

    <h2>
      🛒 Meu carrinho
    </h2>

    <button
      class="close"
      onclick="fecharCarrinho()"
    >
      ×
    </button>

  </div>


  <div
    class="cart-items"
    id="cartItems"
  >

  </div>


  <div class="cart-foot">

    <div class="total">

      <span>
        Total
      </span>

      <span id="cartTotal">
        R$ 0,00
      </span>

    </div>


    <button
      class="checkout"
      onclick="finalizarPedido()"
    >
      Finalizar pedido pelo WhatsApp
    </button>


    <button
      class="clear"
      onclick="limparCarrinho()"
    >
      Limpar carrinho
    </button>


    <div class="notice">
      Confira seu pedido antes de finalizar.
    </div>

  </div>

</aside>


<script>

/* =====================================================
   PRODUTOS
===================================================== */

const produtos = [

  {
    nome: "Barca G Açaí",

    preco: 40,

    imagem: "barca.jpg",

    tag: "Para compartilhar",

    descricao:
      "Barca especial do Point, preparada com açaí e diversos complementos. Acompanha 2 adicionais."
  },


  {
    nome: "Roleta G Açaí",

    preco: 35,

    imagem: "roleta.jpg",

    tag: "Experiência Point",

    descricao:
      "Uma experiência completa para quem ama variedade. Acompanha 2 adicionais."
  },


  {
    nome: "Vitamina de Açaí",

    preco: 17,

    imagem: "vitamina.jpg",

    tag: "Energia e sabor",

    descricao:
      "Feita com açaí selecionado para mais sabor e energia."
  }

];


/* =====================================================
   CARRINHO
===================================================== */

let carrinho = [];


/* =====================================================
   FORMATA DINHEIRO
===================================================== */

function dinheiro(valor){

  return valor.toLocaleString(
    "pt-BR",
    {
      style:"currency",
      currency:"BRL"
    }
  );

}


/* =====================================================
   MOSTRA PRODUTOS
===================================================== */

function mostrarProdutos(){

  const area =
    document.getElementById("produtos");


  area.innerHTML =
    produtos.map(

      (produto,index) => `

        <article class="card">

          <img
            src="${produto.imagem}"
            alt="${produto.nome}"
            onerror="this.style.display='none';"
          >

          <div class="card-body">

            <div class="tag">
              ${produto.tag}
            </div>

            <h3>
              ${produto.nome}
            </h3>

            <p>
              ${produto.descricao}
            </p>

            <div class="price-row">

              <div class="price">
                ${dinheiro(produto.preco)}
              </div>

              <button
                class="add-btn"
                onclick="adicionar(${index})"
              >
                Adicionar
              </button>

            </div>

          </div>

        </article>

      `

    ).join("");

}


/* =====================================================
   ADICIONAR AO CARRINHO
===================================================== */

function adicionar(index){

  const produto =
    produtos[index];


  const existente =
    carrinho.find(
      item =>
        item.nome === produto.nome
    );


  if(existente){

    existente.qtd++;

  }else{

    carrinho.push({

      ...produto,

      qtd:1

    });

  }


  atualizarCarrinho();


  abrirCarrinho();

}


/* =====================================================
   ALTERAR QUANTIDADE
===================================================== */

function alterarQuantidade(
  index,
  quantidade
){

  carrinho[index].qtd += quantidade;


  if(
    carrinho[index].qtd <= 0
  ){

    carrinho.splice(index,1);

  }


  atualizarCarrinho();

}


/* =====================================================
   REMOVER PRODUTO
===================================================== */

function remover(index){

  carrinho.splice(index,1);

  atualizarCarrinho();

}


/* =====================================================
   LIMPAR CARRINHO
===================================================== */

function limparCarrinho(){

  carrinho = [];

  atualizarCarrinho();

}


/* =====================================================
   ATUALIZAR CARRINHO
===================================================== */

function atualizarCarrinho(){

  const area =
    document.getElementById(
      "cartItems"
    );


  const quantidade =
    carrinho.reduce(

      (total,item) =>
        total + item.qtd,

      0

    );


  const valorTotal =
    carrinho.reduce(

      (total,item) =>
        total +
        (
          item.preco *
          item.qtd
        ),

      0

    );


  document.getElementById(
    "cartCount"
  ).textContent =
    quantidade;


  document.getElementById(
    "cartTotal"
  ).textContent =
    dinheiro(valorTotal);


  if(
    carrinho.length === 0
  ){

    area.innerHTML = `

      <div class="empty">

        Seu carrinho está vazio.

        <br><br>

        Adicione um especial para começar.

      </div>

    `;

    return;

  }


  area.innerHTML =

    carrinho.map(

      (item,index) => `

        <div class="item">

          <img
            src="${item.imagem}"
            alt="${item.nome}"
          >

          <div>

            <h4>
              ${item.nome}
            </h4>

            <div class="item-price">
              ${dinheiro(item.preco)}
            </div>


            <div class="qty">

              <button
                onclick="alterarQuantidade(${index},-1)"
              >
                −
              </button>


              <strong>
                ${item.qtd}
              </strong>


              <button
                onclick="alterarQuantidade(${index},1)"
              >
                +
              </button>

            </div>


            <button
              class="remove"
              onclick="remover(${index})"
            >
              Remover
            </button>

          </div>


          <div class="item-total">

            ${dinheiro(
              item.preco *
              item.qtd
            )}

          </div>

        </div>

      `

    ).join("");

}


/* =====================================================
   ABRIR CARRINHO
===================================================== */

function abrirCarrinho(){

  document
    .getElementById("cart")
    .classList
    .add("open");


  document
    .getElementById("overlay")
    .classList
    .add("open");

}


/* =====================================================
   FECHAR CARRINHO
===================================================== */

function fecharCarrinho(){

  document
    .getElementById("cart")
    .classList
    .remove("open");


  document
    .getElementById("overlay")
    .classList
    .remove("open");

}


/* =====================================================
   FINALIZAR PELO WHATSAPP
===================================================== */

function finalizarPedido(){

  if(
    carrinho.length === 0
  ){

    alert(
      "Adicione pelo menos um produto ao carrinho."
    );

    return;

  }


  const total =
    carrinho.reduce(

      (soma,item) =>
        soma +
        (
          item.preco *
          item.qtd
        ),

      0

    );


  const produtosTexto =
    carrinho.map(

      item =>

        `• ${item.nome} x${item.qtd} — ${dinheiro(
          item.preco *
          item.qtd
        )}`

    ).join("\n");


  const mensagem =

`Olá! Quero fazer este pedido:

${produtosTexto}

Total: ${dinheiro(total)}`;


  /*
  =====================================================
  TROQUE PELO WHATSAPP DA SUA LOJA

  Exemplo:
  5581987654321

  NÃO coloque:
  +
  espaços
  parênteses
  traços
  =====================================================
  */

  const numeroWhatsApp =
    "5581999999999";


  const link =

    "https://wa.me/" +
    numeroWhatsApp +
    "?text=" +
    encodeURIComponent(
      mensagem
    );


  window.open(
    link,
    "_blank"
  );

}


/* =====================================================
   INICIAR SITE
===================================================== */

mostrarProdutos();

atualizarCarrinho();

</script>

</body>
</html>
